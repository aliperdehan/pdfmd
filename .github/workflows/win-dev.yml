# TEMPORARY (cloud/portability): the failing Windows modules only, and a few experiments on what MiKTeX does. Removed before the PR is done.
name: win-dev
on:
  pull_request:
    paths: [".github/workflows/win-dev.yml"]
jobs:
  win-dev:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash {0}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pandoc/actions/setup@v1
      - name: MiKTeX, poppler
        run: |
          choco install miktex poppler -y --no-progress
          echo 'C:\Program Files\MiKTeX\miktex\bin\x64' >> "$GITHUB_PATH"
          echo 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"      # in front of MiKTeX's own pdftotext
          "/c/Program Files/MiKTeX/miktex/bin/x64/initexmf" --admin --set-config-value='[MPM]AutoInstall=1'
      - run: pip install .
      - name: Fonts
        run: |
          pdfmd --install fonts:stix-two
          pdfmd --install fonts:jetbrains-mono
          pdfmd --install fonts:dejavu
      - name: "Experiment 0: which poppler"
        run: |
          which -a pdftotext pdftocairo pdftoppm
          pdftotext -v 2>&1 | head -2
          pdftocairo -v 2>&1 | head -2
          echo '<p>x</p>' > /tmp/x.html
      - name: "Experiment 1: the ASCII helper without Python's UTF-8 mode"
        run: |
          mkdir -p /tmp/e1 && cd /tmp/e1
          printf -- '---\ntitle: T\n---\n\nA 日本 b.\n' > doc.md
          unset PYTHONUTF8
          python "$GITHUB_WORKSPACE/pdfmd.py" doc.md --to ascii 2>&1 | head -8
          echo "--- the helper by hand:"
          printf 'A\0\xe6\x97\xa5\0b.' | python "$GITHUB_WORKSPACE/pdfmd.py" --ascii-stdio question rep.json all | od -c | head -3
          echo "--- with UTF-8 mode:"
          PYTHONUTF8=1 python "$GITHUB_WORKSPACE/pdfmd.py" doc.md --to ascii 2>&1 | head -8
          printf -- '---\ntitle: T\npdfmd-options:\n  ascii: {missing: drop}\n---\n\nA 日 b.\n' > d2.md
          PYTHONUTF8=1 python "$GITHUB_WORKSPACE/pdfmd.py" d2.md --to ascii 2>&1 | head -4; od -c d2.ascii.txt | head -3
      - name: "Experiment 2: lualatex when LOCALAPPDATA is somewhere else (what pdfmd does for a read-only home)"
        run: |
          export PATH="/c/Program Files/MiKTeX/miktex/bin/x64:$PATH"
          mkdir -p /tmp/e2 && cd /tmp/e2 && printf '\\documentclass{article}\\usepackage{fontspec}\\begin{document}Hi\\end{document}\n' > hello.tex
          mkdir -p "$RUNNER_TEMP/la"
          echo "--- normal"; lualatex -interaction=nonstopmode hello.tex 2>&1 | tail -6; echo "exit=${PIPESTATUS[0]}"
          echo "--- LOCALAPPDATA elsewhere"; LOCALAPPDATA="$(cygpath -w "$RUNNER_TEMP/la")" lualatex -interaction=nonstopmode hello.tex 2>&1 | tail -25; echo "exit=${PIPESTATUS[0]}"
          echo "--- TEXMFVAR elsewhere only"; TEXMFVAR="$(cygpath -w "$RUNNER_TEMP/la")" lualatex -interaction=nonstopmode hello.tex 2>&1 | tail -6; echo "exit=${PIPESTATUS[0]}"
      - name: "Experiment 3: kpsewhich and a TeX tree of one's own"
        run: |
          export PATH="/c/Program Files/MiKTeX/miktex/bin/x64:$PATH"
          d="$RUNNER_TEMP/texhome"; mkdir -p "$d/tex/latex/thing"; echo '\ProvidesPackage{thing}' > "$d/tex/latex/thing/thing.sty"
          w="$(cygpath -w "$d")"
          echo "TEXMFHOME:";        TEXMFHOME="$w" kpsewhich thing.sty; echo "exit=$?"
          echo "TEXINPUTS;:";       TEXINPUTS="$w//;" kpsewhich thing.sty; echo "exit=$?"
          echo "both:";             TEXMFHOME="$w" TEXINPUTS="$w//;" kpsewhich thing.sty; echo "exit=$?"
          echo "MIKTEX_USERROOTS:"; MIKTEX_USERROOTS="$w" kpsewhich thing.sty; echo "exit=$?"
          echo "-- pdftotext:"; which pdftotext pdftoppm
      - name: "Experiment 4: the label draft pass on MiKTeX"
        run: |
          export PATH="/c/Program Files/MiKTeX/miktex/bin/x64:$PATH"
          d="$(cygpath -w "$RUNNER_TEMP")\\dp"; mkdir -p "$RUNNER_TEMP/dp/out"; cd "$RUNNER_TEMP/dp"
          printf '\\documentclass{article}\\begin{document}\\section{A}\\label{a}See \\ref{a}.\\end{document}\n' > t.tex
          echo "--- -draftmode, -output-directory, windows paths"; lualatex -draftmode -interaction=nonstopmode -output-directory "$d\\out" "$d\\t.tex" 2>&1 | tail -5; ls out
          echo "--- --draftmode"; lualatex --draftmode -interaction=nonstopmode -output-directory "$d\\out" "$d\\t.tex" 2>&1 | tail -5; ls out
          echo "--- no draftmode"; lualatex -interaction=nonstopmode -output-directory "$d\\out" "$d\\t.tex" 2>&1 | tail -5; ls out
          echo "--- cwd of the file, relative name"; lualatex -draftmode -interaction=nonstopmode -output-directory out t.tex 2>&1 | tail -5; ls out
          s="$(cygpath -d "$RUNNER_TEMP/dp")"; echo "--- the 8.3 name: $s"; lualatex -draftmode -interaction=nonstopmode -output-directory "$s\\out" "$s\\t.tex" 2>&1 | tail -4
          l="$(cygpath -w -l "$s")"; echo "--- its long name: $l"
      - name: The failing modules
        shell: bash
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          python -m unittest -v tests.test_command_words tests.test_ansi tests.test_ascii tests.test_attach tests.test_autolog tests.test_code_blocks tests.test_edit_pdf tests.test_header_includes tests.test_indent tests.test_keep_source tests.test_labels tests.test_markup_center tests.test_markup_highlight tests.test_markup_keep tests.test_markup_landscape tests.test_show_comments tests.test_office tests.test_office_latex tests.test_package_helper tests.test_picture_cache_protocol tests.test_readonly_home tests.test_sections tests.test_setup tests.test_tables tests.test_texpackages
