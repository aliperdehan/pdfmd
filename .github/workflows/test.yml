# Builds the examples on Windows, macOS and Linux. Called by publish.yml on
# every push to main (so tests gate every release); also runnable by hand.
name: Test

on:
  workflow_call:            # used by publish.yml
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab
  pull_request:

jobs:
  examples:
    strategy:
      fail-fast: false      # keep testing the other systems if one fails
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash         # same commands on all three systems
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pandoc/actions/setup@v1         # installs Pandoc
      - uses: typst-community/setup-typst@v4  # installs Typst (a PDF engine)
      - run: pip install .                    # installs pdfmd like a user would
      - run: pdfmd --version
      - run: pdfmd --check-dependencies
      - name: Build the examples
        working-directory: examples
        run: |
          pdfmd lecture -e typst
          pdfmd results -e typst
          pdfmd book -r -o book.pdf -e typst
          (cd parts && pdfmd report -e typst && pdfmd 'report#methods' -e typst)
          pdfmd lecture -o lecture.html
          pdfmd lectur -o lecture.html      # the start of a name (WARN), lookup tiers
          pdfmd 'lecture#keyideas' -e typst  # one section of an ordinary document
      - uses: actions/upload-artifact@v4      # lets you download the PDFs
        with:
          name: pdfs-${{ matrix.os }}
          path: examples/*.pdf

  # v3.20.0: a machine with no Pandoc and no PDF engine, where pdfmd falls back
  # to its built-in renderers. The unit tests mock the lookups and the end-to-end
  # ones run pdfmd with an empty PATH, so a Pandoc the runner image happens to
  # carry makes no difference.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: pdfmd --check-dependencies
      - run: python -m unittest discover -s tests -v
      - name: Build an example with the built-in renderer
        run: |
          python - <<'EOF'
          import subprocess, os, sys, tempfile, pathlib
          empty = tempfile.mkdtemp()
          env = {**os.environ, "PATH": empty, "PDFMD_NO_PROMPT": "1"}
          subprocess.run([sys.executable, "-m", "pdfmd", "examples/lecture.md", "-e", "inkmd",
                          "-o", "native-lecture.pdf"], check=True, env=env)
          assert pathlib.Path("native-lecture.pdf").read_bytes().startswith(b"%PDF-")
          EOF
      - name: With md2pdf and math (Python 3.11 or newer)
        if: matrix.python != '3.10'
        run: |
          pip install ".[math]"
          python -m unittest discover -s tests -v
          python - <<'EOF'
          import subprocess, os, sys, tempfile, pathlib
          env = {**os.environ, "PATH": tempfile.mkdtemp(), "PDFMD_NO_PROMPT": "1"}
          subprocess.run([sys.executable, "-m", "pdfmd", "tests/fixtures/pandoc.md", "-e", "md2pdf",
                          "-o", "native-md2pdf.pdf"], check=True, env=env)
          assert pathlib.Path("native-md2pdf.pdf").read_bytes().startswith(b"%PDF-")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: native-pdfs-${{ matrix.os }}-${{ matrix.python }}
          path: native-*.pdf

  # v3.20.1: `pdfmd --install full` (Pandoc from PyPI, Typst from its GitHub
  # release) really works on each system, and what it installs builds a PDF.
  install-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .
      - run: pdfmd --install full
      - run: pdfmd --check-dependencies
      - name: The installed Typst runs, and builds a PDF through Pandoc
        run: |
          python - <<'EOF'
          import shutil, subprocess, sys
          import pdfmd
          pdfmd.use_managed_tools()
          folder = pdfmd.tools_directory()
          found = [p for p in folder.iterdir() if p.stem == "typst"]
          assert found, f"no typst in {folder}"
          print(subprocess.run([str(found[0]), "--version"], capture_output=True, text=True, check=True).stdout)
          EOF
          cd examples
          pdfmd lecture -e typst

