# On every push to main: run the tests on Windows/macOS/Linux, then, if they
# pass AND PDFMD_VERSION isn't on PyPI yet, build, publish to PyPI and tag
# the commit vX.Y.Z. A push that doesn't bump the version publishes nothing.
#
# Publishing uses PyPI trusted publishing (no stored token). PyPI trusts
# this exact file name (publish.yml) and the "pypi" environment, so don't
# rename either.
name: Test and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      new: ${{ steps.check.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          version=$(python3 -c "import ast; t=ast.parse(open('pdfmd.py').read()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and getattr(n.targets[0], 'id', '') == 'PDFMD_VERSION'))")
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/pdfmd-cli/$version/json")
          echo "PDFMD_VERSION=$version; PyPI answered $code for it (404 = not published yet)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Only a definite 404 counts as new, so a PyPI hiccup never double-publishes.
          if [ "$code" = "404" ]; then echo "new=true" >> "$GITHUB_OUTPUT"; else echo "new=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: [test, version]
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [build, version]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    needs: [publish, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git tag "v${{ needs.version.outputs.version }}"
          git push origin "v${{ needs.version.outputs.version }}"
