# The Docker image ghcr.io/<owner>/pdfmd, in four variants (docker/Dockerfile): slim, tex, office, full.
#
# Called by publish.yml after a release reached PyPI (the image installs that release from PyPI), and by hand from the
# Actions tab for a test build (push off: the images are built and smoke-tested, nothing is published) or to publish the
# images of a release that is already on PyPI.
#
# Each variant is built natively for amd64 and arm64 (no emulation), smoke-tested in the container with no network, pushed by
# digest, and then one job per variant joins the two digests into one multi-platform tag.
name: Docker image

on:
  workflow_call:
    inputs:
      version:
        description: The pdfmd-cli version on PyPI
        required: true
        type: string
      push:
        description: Push the images to ghcr.io
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: A pdfmd-cli version that is on PyPI (for example 3.31.46)
        required: true
        type: string
      push:
        description: Push the images to ghcr.io (off = build and test only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.variant }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, tex, office, full]
        arch: [amd64, arm64]
        include:
          - {variant: slim, tex: 0, office: 0}
          - {variant: tex, tex: 1, office: 0}
          - {variant: office, tex: 0, office: 1}
          - {variant: full, tex: 1, office: 1}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      SCOPE: ${{ matrix.variant }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pdfmd" >> "$GITHUB_ENV"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          build-args: |
            PDFMD_VERSION=${{ inputs.version }}
            TEX=${{ matrix.tex }}
            OFFICE=${{ matrix.office }}
          load: true
          tags: pdfmd-test:${{ matrix.variant }}
          cache-from: type=gha,scope=${{ env.SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.SCOPE }}
      - name: Size
        run: docker image ls pdfmd-test:${{ matrix.variant }}
      - name: Smoke test
        run: docker/smoke.sh pdfmd-test:${{ matrix.variant }} ${{ matrix.tex == 1 && 'tex' || '' }} ${{ matrix.office == 1 && 'office' || '' }}
      - name: Log in to ghcr.io
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        if: inputs.push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          build-args: |
            PDFMD_VERSION=${{ inputs.version }}
            TEX=${{ matrix.tex }}
            OFFICE=${{ matrix.office }}
          cache-from: type=gha,scope=${{ env.SCOPE }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest
        if: inputs.push
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - name: Upload the digest
        if: inputs.push
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: tags of ${{ matrix.variant }}
    if: inputs.push
    needs: build
    runs-on: ubuntu-latest
    environment: docker      # the tags are the deployment: GitHub lists it beside pypi and homebrew
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, tex, office, full]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One tag for both architectures
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pdfmd"
          if [ "${{ matrix.variant }}" = slim ]; then
            tags=("$image:${{ inputs.version }}" "$image:latest")
          else
            tags=("$image:${{ inputs.version }}-${{ matrix.variant }}" "$image:${{ matrix.variant }}")
          fi
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          # shellcheck disable=SC2046
          docker buildx imagetools create "${args[@]}" $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "${tags[0]}"
