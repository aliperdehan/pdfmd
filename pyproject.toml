[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
# "pdfmd" on PyPI is an unrelated PDF-to-Markdown tool; the command this
# package installs is still `pdfmd`.
name = "pdfmd-cli"
dynamic = ["version"]
description = "One command from Markdown to a good-looking PDF: a Pandoc wrapper with smart defaults, project-file discovery and a multi-engine fallback chain"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "pdfmd_inkmd/LICENSE", "pdfmd_inkmd/assets/fonts/DejaVuSans-LICENSE.txt"]
authors = [{ name = "Ali Perdekhan" }]
requires-python = ">=3.9"
# Both are optional inside pdfmd.py (it degrades with a WARN without them);
# installed by default so `pdfmd-options:` front matter and PDF metadata
# stamping just work.
dependencies = ["pyyaml", "pypdf"]
keywords = ["pandoc", "markdown", "pdf", "latex", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.optional-dependencies]
# Without Pandoc or a PDF engine, pdfmd falls back to a built-in renderer
# (a vendored inkmd, in pdfmd_inkmd/). These two make it better:
#   math  - md2pdf (pymd2pdf, Python 3.11+) with offline LaTeX math
#   emoji - the colour emoji font, which the vendored inkmd leaves out
#   pandoc - the real Pandoc (pypandoc_binary bundles the executable)
#   translit - pypinyin and anyascii: pdfmd finds 命運.md when told `mingyun` (--translit han)
#   tui - prompt_toolkit: the optional full-screen `pdfmd --setup fancy` (the numbered list needs nothing)
# `pdfmd --install math|emoji|pandoc` installs the same things; `--install
# typst` (a release binary from GitHub, not on PyPI) and `full` (pandoc + typst)
# go beyond what pip can do.
math = ["pymd2pdf>=0.6,<0.7; python_version >= '3.11'", "matplotlib"]
emoji = ["inkmd>=0.5,<0.6"]
translit = ["pypinyin", "anyascii"]
pandoc = ["pypandoc_binary"]
tui = ["prompt_toolkit>=3"]

[project.urls]
Homepage = "https://github.com/aliperdehan/pdfmd"
Changelog = "https://github.com/aliperdehan/pdfmd/blob/main/CHANGELOG.md"

[project.scripts]
pdfmd = "pdfmd:main"
# The same command under the package's own name: `pdfmd` is also the name of an unrelated
# PDF-to-Markdown tool, and `pdfmd-cli` is never ambiguous when both are installed.
pdfmd-cli = "pdfmd:main"
# mdpdf's own command line (-o -h -f -t -s -a -k -p), answered by pdfmd; see mdpdf_translate.
mdpdf = "pdfmd:mdpdf_main"
# inkmd's own command line, answered by pdfmd with its built-in renderer; see inkmd_main.
inkmd = "pdfmd:inkmd_main"

[tool.setuptools]
py-modules = ["pdfmd"]
packages = ["pdfmd_inkmd", "pdfmd_lua", "pdfmd_office", "pdfmd_setup", "pdfmd_tables", "pdfmd_unicode"]

[tool.setuptools.package-data]
pdfmd_inkmd = ["py.typed", "LICENSE", "VENDORED.md", "assets/fonts/*"]
pdfmd_lua = ["*.lua", "*.tex"]
pdfmd_office = ["*.lua"]

[tool.setuptools.dynamic]
version = { attr = "pdfmd.PDFMD_VERSION" }
