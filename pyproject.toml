[build-system]
requires = ["setuptools>=77"]    # PEP 639: the license and license-files fields below
build-backend = "setuptools.build_meta"

[project]
# "pdfmd" on PyPI is an unrelated PDF-to-Markdown tool; the command this
# package installs is still `pdfmd`.
name = "pdfmd-cli"
dynamic = ["version"]
description = "One command from Markdown to a good-looking PDF: a Pandoc wrapper with smart defaults, project-file discovery and a multi-engine fallback chain"
readme = "README.md"
# pdfmd is MIT; lib/pdfmd_mhchem/ is a port of mhchemParser and keeps its Apache licence
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "lib/pdfmd_inkmd/LICENSE", "lib/pdfmd_inkmd/assets/fonts/DejaVuSans-LICENSE.txt", "lib/pdfmd_mhchem/LICENSE", "lib/pdfmd_yaml/LICENSE"]
authors = [{ name = "Ali Perdekhan" }]
requires-python = ">=3.9"
# Both are optional inside pdfmd.py (it degrades with a WARN without them);
# installed by default so `pdfmd-options:` front matter and PDF metadata
# stamping just work.
dependencies = ["pyyaml", "pypdf"]
keywords = ["pandoc", "markdown", "pdf", "latex", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.optional-dependencies]
# Without Pandoc or a PDF engine, pdfmd falls back to a built-in renderer
# (a vendored inkmd, in lib/pdfmd_inkmd/). These two make it better:
#   math  - md2pdf (pymd2pdf, Python 3.11+) with offline LaTeX math
#   emoji - the colour emoji font, which the vendored inkmd leaves out
#   pandoc - the real Pandoc (pypandoc_binary bundles the executable)
#   translit - pypinyin and anyascii: pdfmd finds 命運.md when told `mingyun` (--translit han)
#   tui - prompt_toolkit: the optional full-screen `pdfmd --setup fancy` (the numbered list needs nothing)
# `pdfmd --install math|emoji|pandoc` installs the same things; `--install
# typst` (a release binary from GitHub, not on PyPI) and `full` (pandoc + typst)
# go beyond what pip can do.
math = ["pymd2pdf>=0.6,<0.7; python_version >= '3.11'", "matplotlib"]
emoji = ["inkmd>=0.5,<0.6"]
translit = ["pypinyin", "anyascii"]
pandoc = ["pypandoc_binary"]
tui = ["prompt_toolkit>=3"]

[project.urls]
Homepage = "https://github.com/aliperdehan/pdfmd"
Changelog = "https://github.com/aliperdehan/pdfmd/blob/main/CHANGELOG.md"

[project.scripts]
pdfmd = "pdfmd:main"
# The same command under the package's own name: `pdfmd` is also the name of an unrelated
# PDF-to-Markdown tool, and `pdfmd-cli` is never ambiguous when both are installed.
pdfmd-cli = "pdfmd:main"
# mdpdf's own command line (-o -h -f -t -s -a -k -p), answered by pdfmd; see mdpdf_translate.
mdpdf = "pdfmd:mdpdf_main"
# the keys of jmaupetit's md2pdf, md-to-pdf and kxxoling's md2pdf, answered by pdfmd; see md2pdf_translate.
md2pdf = "pdfmd:md2pdf_main"
# inkmd's own command line, answered by pdfmd with its built-in renderer; see inkmd_main.
inkmd = "pdfmd:inkmd_main"
# `pdfmd -b` on one folder (the current one by default), the name of the first script; see batchmd_main.
batchmd = "pdfmd:batchmd_main"
# The first version of pdfmd was a shell function, `pandoc "$@" --pdf-engine=tectonic --pdf-engine-opt=--chatter=minimal`.
pan-tec = "pdfmd:pan_tec_main"

[tool.setuptools]
py-modules = ["pdfmd"]
packages = ["pdfmd_ansi", "pdfmd_args", "pdfmd_assemble", "pdfmd_attach", "pdfmd_batch", "pdfmd_bridge", "pdfmd_buildinfo", "pdfmd_cache", "pdfmd_chain", "pdfmd_check", "pdfmd_chem", "pdfmd_comments", "pdfmd_compat", "pdfmd_crop", "pdfmd_css", "pdfmd_direct", "pdfmd_docs", "pdfmd_doctor", "pdfmd_edit", "pdfmd_flat", "pdfmd_flavours", "pdfmd_help", "pdfmd_history", "pdfmd_hybrid", "pdfmd_images", "pdfmd_inkmd", "pdfmd_install", "pdfmd_kits", "pdfmd_labels", "pdfmd_lookup", "pdfmd_lua", "pdfmd_mhchem", "pdfmd_native", "pdfmd_obsidian", "pdfmd_office", "pdfmd_paragraph", "pdfmd_parts", "pdfmd_pdfimages", "pdfmd_polish", "pdfmd_ranking", "pdfmd_raw", "pdfmd_report", "pdfmd_restore", "pdfmd_routing", "pdfmd_serve", "pdfmd_setup", "pdfmd_smiles", "pdfmd_tables", "pdfmd_templates", "pdfmd_tex", "pdfmd_unicode", "pdfmd_view", "pdfmd_watch", "pdfmd_web", "pdfmd_yaml"]

# the packages live in lib/ (the root held thirty folders); pdfmd.py itself stays in the root
[tool.setuptools.package-dir]
pdfmd_ansi = "lib/pdfmd_ansi"
pdfmd_args = "lib/pdfmd_args"
pdfmd_assemble = "lib/pdfmd_assemble"
pdfmd_attach = "lib/pdfmd_attach"
pdfmd_batch = "lib/pdfmd_batch"
pdfmd_bridge = "lib/pdfmd_bridge"
pdfmd_buildinfo = "lib/pdfmd_buildinfo"
pdfmd_cache = "lib/pdfmd_cache"
pdfmd_chain = "lib/pdfmd_chain"
pdfmd_check = "lib/pdfmd_check"
pdfmd_chem = "lib/pdfmd_chem"
pdfmd_comments = "lib/pdfmd_comments"
pdfmd_compat = "lib/pdfmd_compat"
pdfmd_crop = "lib/pdfmd_crop"
pdfmd_css = "lib/pdfmd_css"
pdfmd_direct = "lib/pdfmd_direct"
pdfmd_docs = "lib/pdfmd_docs"
pdfmd_doctor = "lib/pdfmd_doctor"
pdfmd_edit = "lib/pdfmd_edit"
pdfmd_flat = "lib/pdfmd_flat"
pdfmd_flavours = "lib/pdfmd_flavours"
pdfmd_help = "lib/pdfmd_help"
pdfmd_history = "lib/pdfmd_history"
pdfmd_hybrid = "lib/pdfmd_hybrid"
pdfmd_images = "lib/pdfmd_images"
pdfmd_inkmd = "lib/pdfmd_inkmd"
pdfmd_install = "lib/pdfmd_install"
pdfmd_kits = "lib/pdfmd_kits"
pdfmd_labels = "lib/pdfmd_labels"
pdfmd_lookup = "lib/pdfmd_lookup"
pdfmd_lua = "lib/pdfmd_lua"
pdfmd_mhchem = "lib/pdfmd_mhchem"
pdfmd_native = "lib/pdfmd_native"
pdfmd_obsidian = "lib/pdfmd_obsidian"
pdfmd_office = "lib/pdfmd_office"
pdfmd_paragraph = "lib/pdfmd_paragraph"
pdfmd_parts = "lib/pdfmd_parts"
pdfmd_pdfimages = "lib/pdfmd_pdfimages"
pdfmd_polish = "lib/pdfmd_polish"
pdfmd_ranking = "lib/pdfmd_ranking"
pdfmd_raw = "lib/pdfmd_raw"
pdfmd_report = "lib/pdfmd_report"
pdfmd_restore = "lib/pdfmd_restore"
pdfmd_routing = "lib/pdfmd_routing"
pdfmd_serve = "lib/pdfmd_serve"
pdfmd_setup = "lib/pdfmd_setup"
pdfmd_smiles = "lib/pdfmd_smiles"
pdfmd_tables = "lib/pdfmd_tables"
pdfmd_templates = "lib/pdfmd_templates"
pdfmd_tex = "lib/pdfmd_tex"
pdfmd_unicode = "lib/pdfmd_unicode"
pdfmd_view = "lib/pdfmd_view"
pdfmd_watch = "lib/pdfmd_watch"
pdfmd_web = "lib/pdfmd_web"

pdfmd_yaml = "lib/pdfmd_yaml"

[tool.setuptools.package-data]
pdfmd_yaml = ["LICENSE", "VENDORED.md"]
pdfmd_docs = ["*.md"]
pdfmd_inkmd = ["py.typed", "LICENSE", "VENDORED.md", "assets/fonts/*"]
pdfmd_lua = ["*.lua", "*.tex", "*.cjs"]
pdfmd_mhchem = ["LICENSE"]
pdfmd_office = ["*.lua"]
pdfmd_templates = ["data/*/*", "data/*/*/*"]
pdfmd_web = ["index.html", "css/*.css", "js/*.js", "fixtures/*.js", "fixtures/*.pdf", "vendor/cm/codemirror.js", "vendor/cm/LICENSES.txt", "syntax/syntaxes.json"]

[tool.setuptools.dynamic]
version = { attr = "pdfmd.PDFMD_VERSION" }
